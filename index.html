<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>政壇哈哈鏡｜政治人物分享交流平台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="nav-wrap">
      <button class="logo" onclick="navigate('home')">
        <span class="logo-icon">🎭</span>
        <span>政壇哈哈鏡</span>
      </button>
      <nav class="nav-links">
        <button onclick="setSection('forum')">論壇區</button>
        <button onclick="setSection('image')">圖片區</button>
        <button onclick="requireLogin(() => navigate('create'))">我要開麥</button>
        <button onclick="requireLogin(() => navigate('profile'))">個人首頁</button>
      </nav>
      <div id="authArea" class="auth-area"></div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <div id="loginModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" onclick="closeLoginModal()">×</button>
      <h2>想開麥？請先登入！</h2>
      <p>目前你是政壇觀眾席，只能看不能發言。登入後才能按讚、留言、發布貼文。</p>
      <div class="modal-actions">
        <button class="primary-btn" onclick="closeLoginModal(); navigate('login')">登入</button>
        <button class="secondary-btn" onclick="closeLoginModal(); navigate('register')">註冊</button>
        <button class="ghost-btn" onclick="closeLoginModal()">先繼續旁觀</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
